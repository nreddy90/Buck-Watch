server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: buckwatch-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:buckwatch}}
    username: ${DB_USER:buckwatch}
    password: ${DB_PASSWORD:change_me_local_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: false
    locations: classpath:db/migration

buckwatch:
  demo:
    enabled: ${BUCKWATCH_DEMO_ENABLED:true}
    current-city: ${DEMO_CURRENT_CITY:Atlanta, GA, United States}
  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
